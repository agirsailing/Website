                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M19.98 2.99A1 1 0 0 0 19.87 3H15a1 1 0 1 0 0 2h2.59l-9.3 9.29a1 1 0 1 0 1.42 1.42L19 6.41V9a1 1 0 1 0 2 0V4.13a1 1 0 0 0-1.02-1.14ZM5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a1 1 0 1 0-2 0v6H5V5h6a1 1 0 1 0 0-2H5Z"/></svg>

        </div>
        <button class="popup__btn prev" id="popupPrev" type="button" aria-label="Previous member">
            <svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32" fill="currentColor" aria-hidden="true"><path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/></svg>

        function initialsAvatar(name) {
            const initials = name
                .trim()
                .split(/\s+/)
                .slice(0, 2)
                .map(part => part[0])
                .join("")
                .toUpperCase();

            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
                    <rect width="320" height="320" fill="#153149"/>
                    <text x="160" y="178" text-anchor="middle"
                          font-family="Arial, sans-serif" font-size="92"
                          font-weight="700" fill="#ffffff">${initials}</text>
                </svg>`;

            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function memberCard(id, role, isLead = false) {
            const member = MEMBERS[id];

            if (!member) {
                throw new Error(`Unknown team member ID: ${id}`);
            }

            const image = member.image || initialsAvatar(member.name);
            const leadClass = isLead ? " team__member--lead" : "";
            const placeholderClass = member.image ? "" : " member__photo-placeholder";

            const roleMarkup = role
                ? `<span class="member__role">${role}</span>`
                : "";

            return `
                <figure class="team__member${leadClass}" data-member-id="${id}">
                    <img class="${placeholderClass.trim()}" src="${image}" alt="Portrait of ${member.name}">
                    <figcaption>
                        <span class="member__name">${member.name}</span>
                        ${roleMarkup}
                    </figcaption>
                </figure>`;
        }

        function renderGroup(group) {
            const cards = [];

            if (group.lead) {
                cards.push(memberCard(group.lead, "Sub-team Lead", true));
            }

            cards.push(...group.members.map(id => memberCard(id, "")));

            return `
                <section class="subteam${group.wide ? " subteam--wide" : ""}">
                    <h4 class="subteam__title">${group.title}</h4>
                    <div class="subteam__members">${cards.join("")}</div>
                </section>`;
        }

        function renderDivision(division) {
            const leaders = division.leaders
                .map(leader => memberCard(leader.id, leader.role, true))
                .join("");

            return `
                <article class="team-box team-division">
                    <h2 class="team-box__title">${division.title}</h2>
                    <div class="team-division__intro">
                        <p class="team-division__label">${division.leadersLabel}</p>
                        <div class="team-structure__leaders">${leaders}</div>
                    </div>
                    <div class="subteams-grid">
                        ${division.groups.map(renderGroup).join("")}
                    </div>
                </article>`;
        }

        document.getElementById("teamStructure").innerHTML = TEAM_STRUCTURE
            .map(renderDivision)
            .join("");
